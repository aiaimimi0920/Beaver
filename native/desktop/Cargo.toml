[package]
name = "beaver-desktop"
version = "0.1.19"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "Beaver"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
beaver-core = { path = "../core" }
anyhow = "1"
base64 = "0.22"
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["net", "io-std", "io-util", "sync", "time"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
fs2 = "0.4"
rfd = "=0.17.2"
tauri = { version = "=2.12.0", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
