name: Direct task interruption
on:
  pull_request:
    paths:
      - "src/direct/**"
      - "tests/direct-interrupt.test.ts"
      - "tests/direct-display.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/direct-task-interrupt.yml"
  push:
    branches: [main]
    paths:
      - "src/direct/**"
      - "tests/direct-interrupt.test.ts"
      - "tests/direct-display.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/direct-task-interrupt.yml"
permissions:
  contents: read
jobs:
  interrupt-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --check src/direct/renderer.js
      - run: node --import tsx --test tests/direct-interrupt.test.ts tests/direct-display.test.ts
