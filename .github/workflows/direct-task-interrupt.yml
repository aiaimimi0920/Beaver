name: Direct task interruption
on:
  pull_request:
    paths:
      - 'src/direct/**'
      - 'tests/direct-interrupt.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/direct-task-interrupt.yml'
  push:
    branches: [main]
    paths:
      - 'src/direct/**'
      - 'tests/direct-interrupt.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/direct-task-interrupt.yml'
permissions:
  contents: read
jobs:
  interrupt-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --check src/direct/renderer.js
      - run: node --import tsx --test tests/direct-interrupt.test.ts
