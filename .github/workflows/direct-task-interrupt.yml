name: Direct task interruption
on:
  pull_request:
    paths:
      - "src/direct/**"
      - "tests/direct-interrupt.test.ts"
      - "tests/direct-display.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/direct-task-interrupt.yml"
  push:
    branches: [main]
    paths:
      - "src/direct/**"
      - "tests/direct-interrupt.test.ts"
      - "tests/direct-display.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/direct-task-interrupt.yml"
permissions:
  contents: read
jobs:
  interrupt-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --check src/direct/renderer.js
      - run: node --import tsx --test tests/direct-interrupt.test.ts tests/direct-display.test.ts
