name: Head generation example
on:
  pull_request:
    paths:
      - "examples/head-generation/**"
      - "resources/packages/npr-characters/addons/npr_character_frame/.ci_script/tools/sdf360/**"
      - "examples/head-review/**"
      - ".github/workflows/head-generation-example.yml"
      - "src/direct/preview.cjs"
      - "tests/head-preview.test.ts"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      [
        main,
        "dot/researched-nose-grammar",
        "dot/researched-mouth-grammar",
        "dot/researched-face-grammar",
      ]
    paths:
      - "examples/head-generation/**"
      - "examples/head-review/**"
      - "resources/packages/npr-characters/addons/npr_character_frame/.ci_script/tools/sdf360/**"
      - ".github/workflows/head-generation-example.yml"
      - "src/direct/preview.cjs"
      - "tests/head-preview.test.ts"
      - "package.json"
      - "package-lock.json"
permissions:
  contents: read
jobs:
  recipe-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 Pillow==12.3.0
      - run: python -m compileall -q examples/head-generation
      - run: python -m unittest discover -s examples/head-generation -p 'test_*.py'
      - run: python examples/head-generation/bundle.py --output /tmp/head-recipe.json
      - run: python -m unittest discover -s examples/head-generation/checkpoints/current -p 'test_*.py'
      - run: python -m unittest discover -s examples/head-generation/sdf360 -p 'test_*.py'
      - run: python examples/head-generation/checkpoints/current/bundle.py --output /tmp/head-current.json
      - run: python examples/head-generation/sdf360/bundle.py --output /tmp/head-sdf.json
      - run: python -m unittest discover -s examples/head-generation/general_face -p 'test_*.py'
      - run: python -m unittest discover -s examples/head-generation/semantic_eyes -p 'test_*.py'
      - run: python -m unittest discover -s examples/head-generation/coherent_surface -p 'test_*.py'
      - run: python -m unittest discover -s examples/head-generation/facial_surface -p 'test_*.py'
      - run: python -m unittest discover -s examples/head-generation/eye_presets -p 'test_*.py'
      - run: python -m unittest discover -s examples/head-generation/face_components -p 'test_*.py'
      - run: python -m unittest discover -s examples/head-generation/brow_library -p 'test_*.py'
      - run: python -m unittest discover -s examples/head-generation/nose_library -p 'test_*.py'
      - run: python -m unittest discover -s examples/head-generation/mouth_library -p 'test_*.py'
      - run: python -m unittest discover -s examples/head-generation/face_library -p 'test_*.py'
      - run: python -m unittest discover -s examples/head-generation/ear_library -p 'test_*.py'
      - run: python -m unittest discover -s examples/head-generation/source_layout -p 'test_*.py'
      - run: python -m unittest discover -s examples/head-generation/faye-face-demo -p 'test_*.py'
      - run: python examples/head-generation/general_face/bundle.py --intent '{"preset":"soft_wide"}' --prefix assets/aster/general_face_ci/ --output /tmp/general-face.json
  preview-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check src/direct/preview.cjs
      - run: node --import tsx --test tests/head-preview.test.ts
