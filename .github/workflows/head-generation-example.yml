name: Head generation example
on:
  pull_request:
    paths:
      - 'examples/head-generation/**'
      - '.github/workflows/head-generation-example.yml'
  push:
    branches: [main]
    paths:
      - 'examples/head-generation/**'
      - '.github/workflows/head-generation-example.yml'
permissions:
  contents: read
jobs:
  recipe-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q examples/head-generation
      - run: python -m unittest discover -s examples/head-generation -p 'test_*.py'
      - run: python examples/head-generation/bundle.py --output /tmp/head-recipe.json
